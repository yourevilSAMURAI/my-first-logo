<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Business card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000; /* Чистый черный цвет */
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .main-text {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 5px;
            color: transparent;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(255, 0, 204, 0.5));
            transition: all 0.3s ease;
        }

        .roman-numeral {
            display: block;
            font-size: 40px;
            color: #ffffff;
            letter-spacing: 10px;
            margin-top: -10px;
            opacity: 0.8;
            text-shadow: 0 0 5px #fff;
        }

        /* Эффект свечения при наведении */
        .container:hover .main-text {
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.8));
        }

        /* Анимация парения */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Декоративные частицы (фон) */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
    </style>
</head>
<body>

    <!-- Декоративные точки вокруг -->
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 0.5s;"></div>
    <div class="particle" style="top: 40%; left: 10%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 60%; left: 90%; animation-delay: 1.5s;"></div>

    <div class="container">
        <!-- Твоя картинка -->
	<img src="https://i.pinimg.com/736x/de/6f/36/de6f36aaa4592fedd03b7e1ad4ccc291.jpg" style="width: 100%; max-width: 400px; height: auto; margin-bottom: 20px;">
        
        <div class="main-text">I’m here and</div>
        <div class="main-text">I came to say…</div>
        <div class="roman-numeral">your evil SAMURAI</div>
    </div>

</body>
</html>
